<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kritarth Singh | Full Stack Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- ---------------- HEADER ---------------- -->
  <header class="hero">
    <span class="badge">FULL STACK WEB DEVELOPMENT</span>
    <h1>Lab Repository</h1>
    <p>
      A collection of my Full Stack Web Development
      experiments and assignments.
    </p>
    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Search experiment..."
      >
    </div>
  </header>

  <!-- ---------------- SECTION TITLE ---------------- -->
  <section class="section-title">
    <h2>Experiments</h2>
  </section>

  <!-- ---------------- PROJECT CARDS ---------------- -->
  <div class="projects">

    <!-- Experiment 1 -->
    <div class="project-card">
      <div class="icon">🎓</div>
      <span class="exp">Experiment 1</span>
      <h3>POST COMPOSER</h3>
      <div class="buttons">
        <a href="https://post-composer-gamma.vercel.app/" class="live">Live Demo</a>
        <a href="https://github.com/kritarthsingh07/fullstack-lab" target="_blank" class="github">GitHub</a>
      </div>
    </div>

    <!-- Duplicate this card for remaining experiments -->
    
    <div class="project-card">
      <div class="icon">⚡</div>
      <span class="exp">Experiment 2</span>
      <h3>Redux toolkit</h3>
      <div class="buttons">
        <a href="https://fullstack-lab-bice.vercel.app/" class="live">Live Demo</a>
        <a href="https://github.com/kritarthsingh07/fullstack-lab" class="github">GitHub</a>
      </div>
    </div>
  

  </div>

  <!-- ---------------- FOOTER ---------------- -->
  <footer>
    <p>Designed by <strong>Kritarth Singh</strong></p>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
